name: Publish signed Android TV APK
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-apk.yml'
      - 'app/src/**'
      - 'app/build.gradle.kts'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # Release signing keys MUST stay in repository secrets, never in public source.
    # Configure the one-time signing setup in docs/UPDATE_SIGNING.md first.
    if: ${{ vars.ANDROID_SIGNING_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
      ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore private release keystore from encrypted secret
        shell: bash
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        run: |
          test -n "$SIGNING_KEYSTORE_B64" || { echo '::error::Missing signing key secret'; exit 1; }
          test -n "$ANDROID_SIGNING_STORE_PASSWORD" || { echo '::error::Missing store password'; exit 1; }
          test -n "$ANDROID_SIGNING_KEY_ALIAS" || { echo '::error::Missing signing alias'; exit 1; }
          test -n "$ANDROID_SIGNING_KEY_PASSWORD" || { echo '::error::Missing key password'; exit 1; }
          printf '%s' "$SIGNING_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/araliklitv-signing.jks"
          chmod 600 "$RUNNER_TEMP/araliklitv-signing.jks"
          echo "ANDROID_SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/araliklitv-signing.jks" >> "$GITHUB_ENV"
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 35 platform
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER" || { echo 'Android SDK manager not installed'; exit 1; }
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Validate question bank
        run: python3 tools/validate_questions.py
      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Build APK with persistent release key
        run: gradle --no-daemon assembleDebug
      - name: Verify signed APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
      - name: Publish to public GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.2.0"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK#AralikliTV.apk" --clobber
          else
            gh release create "$TAG" "$APK#AralikliTV.apk" \
              --target "$GITHUB_SHA" --prerelease \
              --title "Aralikli TV 0.2.0 - Quiz Stage and Updates" \
              --notes "Neon yarisma sahnesi, dogru/yanlis sesleri, tahmin ettim, GitHub surum kontrolu ve izinli APK guncelleme. Android kurulum onayi gerekir. Onceki test APK imzasi farkli olabilir."
          fi
